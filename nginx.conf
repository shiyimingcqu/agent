# ============================================================
# nginx.conf —— 生产环境的反向代理配置
# ============================================================
#
# 生产拓扑：
#   用户浏览器 → 服务器 80 端口 (Nginx)
#                  ├── 静态文件（Vue 构建产物）→ 直接返回
#                  └── /chat /history /documents/upload → 转发给后端容器
#
# 这正是 Vite 开发时代理做的事，只不过那是在开发服务器内部，
# 这里则是生产环境的正式代理，效果完全一样。

server {
    # Nginx 监听 80 端口（HTTP 默认端口）
    listen 80;
    server_name _;

    # ---------- 静态文件 ----------
    # Vue 是单页应用，所有页面都共享同一个入口 index.html。
    # try_files 的逻辑：先找真实文件，找不到就回退到 /index.html，
    # 这样前端路由（如 /chat 页面）刷新时不会 404。
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反向代理 ----------
    # "backend" 是 docker-compose 里的服务名，Docker 内部网络会把它解析成后端容器 IP。
    # proxy_pass 不带路径时，会把浏览器请求的完整路径（如 /chat）原样转发过去。

    # 认证接口（注册 / 登录 / 登出 / 当前用户）
    location /auth {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 聊天接口
    location /chat {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 历史记录接口
    location /history {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 文档上传接口
    location /documents/upload {
        # 文件可能较大，放宽上传体积限制（默认只有 1MB）
        client_max_body_size 20m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RAG 检索接口
    location /search {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}